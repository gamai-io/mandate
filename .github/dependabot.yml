version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    ignore:
      - dependency-name: "actions/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pypa/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "softprops/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    ignore:
      # The build backend is pinned on purpose: the published artefacts were
      # verified byte-for-byte with setuptools 78.1.0 (docs/REPRODUCIBLE.md), and
      # 84.x also requires Python >= 3.10 while this project still tests 3.9.
      - dependency-name: "setuptools"
