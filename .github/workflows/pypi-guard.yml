name: PyPI guard
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - name: Secret / internal-data scan
        run: python tools/prepublish_scan.py dist/*.tar.gz dist/*.whl
      - run: python -m twine check dist/*
