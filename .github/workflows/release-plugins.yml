name: release gamai-plugins
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gamai-io/gamai-plugins
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install -q build twine
          python -m build
          python tools/prepublish_scan.py dist/*.tar.gz dist/*.whl
      - name: Upload
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --non-interactive dist/*
      - name: Yank the vulnerable 0.2.6
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          curl -sS -X POST "https://pypi.org/pypi/gamai-plugins/0.2.6/yank" \
            -H "Authorization: Bearer $TOKEN" \
            --data-urlencode "reason=deny bypass via shell metacharacters; skipped-dir integrity (fixed in 0.2.7/0.2.8)" \
            -w "\nyank HTTP %{http_code}\n"
