name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04  # ubuntu-latest = 26.04, nema Python 3.9 u setup-python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e . cryptography pytest
      - name: Lint
        run: python -m pip install ruff cryptography pytest && ruff check .
      - name: Claims (version, changelog, test counts)
        env:
          CLAIMS_FULL: ${{ matrix.python-version == '3.12' && '1' || '0' }}
        run: python3 tools/claims.py --check --strict
      - name: Tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Offline examples (3.12 only)
        if: matrix.python-version == '3.12'
        env:
          RUN_EXAMPLES: "1"
        run: python -m pytest -q tests/test_examples.py
      - name: Build and check
        run: python -m pip install build twine && python -m build && twine check dist/*
