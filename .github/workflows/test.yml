name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04  # ubuntu-latest = 26.04, nema Python 3.9 u setup-python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e . cryptography pytest
      - name: Lint
        run: python -m pip install ruff cryptography pytest && ruff check .
      - name: Claims (version, changelog, test counts)
        env:
          CLAIMS_FULL: ${{ matrix.python-version == '3.12' && '1' || '0' }}
        run: python3 tools/claims.py --check --strict
      - name: Tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Offline examples (3.12 only)
        if: matrix.python-version == '3.12'
        env:
          RUN_EXAMPLES: "1"
        run: python -m pytest -q tests/test_examples.py
      - name: Build and check
        run: python -m pip install build twine && python -m build && twine check dist/*
      - name: Install the wheel and run the demo
        if: matrix.python-version == '3.12'
        run: |
          python -m venv /tmp/whl
          /tmp/whl/bin/pip install -q dist/*.whl
          /tmp/whl/bin/mandate version
          /tmp/whl/bin/mandate demo --dir /tmp/whl-demo > /dev/null
          python - <<'PY'
          import json
          assert json.load(open("/tmp/whl-demo/demo.json"))["ok"] is True
          print("wheel demo ok")
          PY
