name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install --upgrade pip build twine ruff pytest
      - name: Install the project (claims compares the installed version)
        run: python -m pip install -e .
      - name: Lint
        run: ruff check .
      - name: Tag matches the package version
        run: |
          python3 - <<'PY'
          import os, re, sys
          text = open("pyproject.toml", encoding="utf-8").read()
          version = re.search(r'^version = "([^"]+)"', text, re.M).group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != "v" + version:
              sys.exit("tag %s != package version %s" % (tag, version))
          PY
      - name: Claims
        env:
          CLAIMS_FULL: "1"
        run: python3 tools/claims.py --check --strict
      - name: Tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build (reproducible)
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python -m build
          python3 tools/normalize_sdist.py dist/*.tar.gz
      - name: Twine check
        run: twine check dist/*
      - name: Pre-publish scan (no secrets, no internal paths)
        run: python3 tools/prepublish_scan.py dist/*.tar.gz dist/*.whl
      - name: SBOM (CycloneDX, file hashes)
        run: python3 -m mandate sbom --out sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist
          path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: sbom.json

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist
      - name: Publish (OIDC trusted publishing + PEP 740 attestations)
        if: vars.PYPI_OIDC == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          attestations: true
          skip_existing: true
      - name: Publish (API token)
        if: vars.PYPI_OIDC != 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip_existing: true

  github-release:
    needs: [build, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # only this job needs it
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sbom
          path: sbom
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            dist/*
            sbom/sbom.json
          prerelease: false
          generate_release_notes: true
