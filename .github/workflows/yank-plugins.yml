name: yank gamai-plugins 0.2.6
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  yank:
    runs-on: ubuntu-latest
    steps:
      - name: Yank
        env:
          TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          curl -sS -X POST "https://pypi.org/pypi/gamai-plugins/0.2.6/yank" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"reason":"deny bypass via shell metacharacters; skipped-dir integrity (fixed in 0.2.7/0.2.8)"}' \
            -w "\nyank HTTP %{http_code}\n"
