name: attest

# Signed release provenance: every wheel and sdist this repository publishes can
# be traced to the commit and the workflow run that produced it. A bank's supply
# chain questionnaire asks for exactly this, and until now we had only hashes.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # required for OIDC attestation
  attestations: write

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Scan the artifacts before attesting them
        run: python tools/prepublish_scan.py dist/*.tar.gz dist/*.whl
      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Upload SBOM next to the artifacts
        run: |
          python -m gama_mandate.sbom 2>/dev/null || python -c "import mandate, json; from mandate import report; report.sbom(mandate.__version__, 'dist/sbom.json')"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-with-provenance
          path: dist/*
