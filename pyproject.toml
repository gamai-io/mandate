[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gama-mandate"
version = "0.11.0"
description = "Signed, verifiable business commitments for AI agents: canonical commitment, off-host Ed25519 grant, one-shot redemption, hash-chained receipts."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "GAMA"}]
keywords = ["ai-agents", "trust", "approval", "commitment", "ed25519", "audit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Topic :: Office/Business",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/gamai-io/mandate"
Repository = "https://github.com/gamai-io/mandate"
Issues = "https://github.com/gamai-io/mandate/issues"
Changelog = "https://github.com/gamai-io/mandate/blob/main/CHANGELOG.md"

[project.scripts]
mandate = "mandate.cli:main"
mandate-broker = "mandate.broker:main"
mandate-mcp = "mandate.mcp_server:main"

[tool.setuptools]
packages = ["mandate", "mandate.adapters"]
include-package-data = true

[tool.setuptools.package-data]
mandate = ["data/*.json", "py.typed"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
