[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-mandate"
version = "0.5.0"
description = "Signed, verifiable business commitments for AI agents: canonical commitment, off-host Ed25519 grant, one-shot redemption, hash-chained receipts."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "GAMA"}]
keywords = ["ai-agents", "trust", "approval", "commitment", "ed25519", "audit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Topic :: Office/Business",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/gama/mandate"

[project.scripts]
mandate = "mandate.cli:main"
mandate-broker = "mandate.broker:main"
mandate-mcp = "mandate.mcp_server:main"

[tool.setuptools]
packages = ["mandate", "mandate.adapters"]
include-package-data = true

[tool.setuptools.package-data]
mandate = ["data/*.json"]
