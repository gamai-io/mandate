[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gama-mandate"
version = "0.73.1"
description = "Signed, verifiable business commitments for AI agents: canonical commitment, off-host Ed25519 grant, one-shot redemption, hash-chained receipts."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Renato Šuster", email = "renato@gamatrade.ba"}]
keywords = ["ai-agents", "trust", "approval", "commitment", "ed25519", "audit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
mssql = ["pyodbc>=5"]

[project.urls]
Homepage = "https://github.com/gamai-io/mandate"
Repository = "https://github.com/gamai-io/mandate"
Issues = "https://github.com/gamai-io/mandate/issues"
Changelog = "https://github.com/gamai-io/mandate/blob/main/CHANGELOG.md"

[project.scripts]
mandate = "mandate.cli:main"
mandate-broker = "mandate.broker:main"
mandate-mcp = "mandate.mcp_server:main"
mandate-fc-bridge = "mandate.firecracker_bridge:main"

[tool.setuptools]
packages = ["mandate", "mandate.adapters"]
include-package-data = true

[tool.setuptools.package-data]
mandate = ["data/*.json", "py.typed"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
